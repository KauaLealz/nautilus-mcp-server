[project]
name = "nautilus-mcp-server"
version = "0.4.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.2",
    "cryptography>=43.0",
    "oracledb>=4.0.1",
    "psycopg[binary]>=3.3.4",
    "pymongo>=4.17.0",
    "pymssql>=2.3.13",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "redis>=8.0.0",
]

[project.scripts]
nautilus-mcp-server = "nautilus.server.app:main"
nautilus = "nautilus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nautilus*"]




